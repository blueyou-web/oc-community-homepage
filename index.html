<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chzzk Together - LCK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="netflix-header">
        <div class="logo">CHZZK TOGETHER</div>
        <div class="header-right">
            <span id="room-name-label" class="room-name-label" style="display:none;"></span>
            <div class="lck-badge">🏆 LCK LIVE</div>
            <div class="user-info">
                <img id="profile-img" src="" alt="프로필" title="클릭해서 프로필 변경">
                <span id="user-display-name">Guest</span>
                <button id="theme-toggle-btn" class="netflix-btn-small" title="테마 전환">🌙</button>
                <button id="change-name-btn" class="netflix-btn-small">이름 변경</button>
                <button id="sound-toggle-btn" class="netflix-btn-small" title="알림음 켜기/끄기">🔔</button>
                <button id="clear-chat-btn" class="netflix-btn-small danger" style="display:none;">채팅 지우기</button>
                <button id="leave-room-btn" class="netflix-btn-small danger" style="display:none;">방 나가기</button>
            </div>
        </div>
    </header>

    <!-- 방 목록(로비) 화면 -->
    <section id="lobby-screen" class="lobby-screen">
        <div class="lobby-inner">
            <div class="lobby-hero">
                <img src="https://i.imgur.com/IdPnlIv.png" alt="LCK" class="lobby-hero-logo" id="lck-logo-img">
                <div class="lobby-hero-fallback" id="lck-logo-fallback" style="display:none;">🏆 LCK</div>
            </div>
            <div class="lobby-title-row">
                <h1 class="lobby-title">같이보기 방</h1>
                <button id="create-room-btn" class="netflix-btn">+ 방 만들기</button>
            </div>
            <div id="room-list" class="room-list">
                <div class="room-list-empty">방을 불러오는 중...</div>
            </div>
        </div>
    </section>

    <!-- 방 안 화면 (영상 + 채팅) -->
    <main id="app-main" class="main-container" style="display:none;">
        <section class="video-section">
            <div class="video-wrapper">
                <iframe id="chzzk-player"
                    src="https://chzzk.naver.com"
                    frameborder="0"
                    allowfullscreen
                    allow="autoplay; fullscreen">
                </iframe>
            </div>
        </section>

        <aside class="chat-section">
            <!-- 참여자 패널 -->
            <div class="participant-container">
                <button id="participant-toggle" class="participant-toggle-btn">
                    <span class="participant-toggle-left">
                        <span class="live-dot"></span>
                        <span>함께 보는 중</span>
                    </span>
                    <span class="participant-toggle-right">
                        <span id="user-count" class="user-count-badge">0</span>
                        <span class="toggle-arrow">▼</span>
                    </span>
                </button>
                <div id="participant-list" class="participant-list"></div>
            </div>

            <div id="chat-messages" class="chat-messages"></div>

            <!-- 응원 & 투표 버튼 -->
            <div class="chat-action-bar" style="position:relative;">
                <button id="cheer-btn" class="action-btn">📣 응원</button>
                <button id="poll-btn" class="action-btn">📊 투표</button>
            </div>

            <form id="chat-form" class="chat-input-area">
                <input type="text" id="message-input" placeholder="친구에게 메시지 보내기..." autocomplete="off" required>
                <button type="submit" class="netflix-btn">전송</button>
            </form>
        </aside>
    </main>

    <!-- 방 만들기 모달 -->
    <div id="room-create-modal" class="poll-modal-overlay" style="display:none;">
        <div class="poll-modal-card">
            <h3>🎬 방 만들기</h3>
            <input id="room-name-input" type="text" placeholder="방 이름 (예: T1 vs Gen.G 같이봐요)" maxlength="40">
            <div class="room-visibility-row">
                <label class="room-radio-label">
                    <input type="radio" name="room-visibility" id="room-public-radio" value="public" checked>
                    🌐 공개방
                </label>
                <label class="room-radio-label">
                    <input type="radio" name="room-visibility" id="room-private-radio" value="private">
                    🔒 비공개방
                </label>
            </div>
            <input id="room-password-input" type="password" placeholder="비밀번호" maxlength="30" style="display:none;">
            <div class="poll-modal-actions">
                <button class="avatar-cancel-btn" id="room-create-cancel">취소</button>
                <button class="netflix-btn" id="room-create-submit">만들기</button>
            </div>
        </div>
    </div>

    <!-- 비공개방 비밀번호 입력 모달 -->
    <div id="room-password-modal" class="poll-modal-overlay" style="display:none;">
        <div class="poll-modal-card">
            <h3>🔒 비밀번호 입력</h3>
            <input id="room-password-prompt-input" type="password" placeholder="비밀번호를 입력하세요" maxlength="30">
            <div class="poll-modal-actions">
                <button class="avatar-cancel-btn" id="room-password-cancel">취소</button>
                <button class="netflix-btn" id="room-password-submit">입장</button>
            </div>
        </div>
    </div>

    <!-- 아바타 픽커 모달 -->
    <div id="avatar-modal" class="avatar-modal-overlay" style="display:none;">
        <div class="avatar-modal-card">
            <h2 class="avatar-modal-title">프로필 선택</h2>
            <p class="avatar-modal-subtitle">누가 보고 있나요?</p>

            <div class="avatar-section-label">🏆 LCK 팀</div>
            <div id="avatar-grid-lck" class="avatar-grid"></div>

            <div class="avatar-section-label">🎨 캐릭터</div>
            <div id="avatar-grid" class="avatar-grid"></div>

            <div class="avatar-modal-actions">
                <button id="avatar-cancel-btn" class="avatar-cancel-btn">취소</button>
                <button id="avatar-confirm-btn" class="netflix-btn" disabled>선택 완료</button>
            </div>
        </div>
    </div>

    <!-- 컨페티 캔버스 -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 소리 토글 (인라인, 모듈 독립) -->
    <script>
        (function () {
            var btn = document.getElementById('sound-toggle-btn');
            if (!btn) return;
            var isOn = localStorage.getItem('chzzk_sound') !== 'off';
            function update() {
                btn.textContent   = isOn ? '🔔' : '🔇';
                btn.title         = isOn ? '알림음 끄기' : '알림음 켜기';
                btn.style.opacity = isOn ? '1' : '0.45';
            }
            update();
            btn.addEventListener('click', function () {
                isOn = !isOn;
                localStorage.setItem('chzzk_sound', isOn ? 'on' : 'off');
                update();
            });
            window.__isSoundOn = function () { return isOn; };
        })();
    </script>

    <!-- 테마 토글 (인라인, 모듈 독립) -->
    <script>
        (function () {
            var btn = document.getElementById('theme-toggle-btn');
            if (!btn) return;
            var saved = localStorage.getItem('chzzk_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            function update() {
                btn.textContent = saved === 'dark' ? '🌙' : '☀️';
                btn.title       = saved === 'dark' ? '라이트 모드로' : '다크 모드로';
            }
            update();
            btn.addEventListener('click', function () {
                saved = saved === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', saved);
                localStorage.setItem('chzzk_theme', saved);
                update();
            });
        })();
    </script>

    <!-- 로고 이미지가 아직 없으면 이모지로 대체 -->
    <script>
        (function () {
            var img = document.getElementById('lck-logo-img');
            var fallback = document.getElementById('lck-logo-fallback');
            if (!img || !fallback) return;
            img.addEventListener('error', function () {
                img.style.display = 'none';
                fallback.style.display = 'flex';
            });
        })();
    </script>

    <script type="module" src="app.js"></script>
</body>
</html>
